<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMO Card Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-wrapper">
    <div class="settings-panel">
        <h1>UMO Generator</h1>

        <div class="form-group">
            <label>Тип картки:</label>
            <select id="templateType">
                <option value="birthday">З Днем народження!</option>
                <option value="probation">Випробувальний термін</option>
            </select>
        </div>

        <div id="singleInputs">
            <div class="form-group">
                <label>Ім'я та Прізвище:</label>
                <input type="text" id="name" placeholder="Бабич Вікторія">
            </div>

            <div class="form-group" id="positionGroup">
                <label>Посада:</label>
                <input type="text" id="position" placeholder="Менеджер з комунікацій">
            </div>

            <div class="form-group">
                <label>Текст привітання:</label>
                <textarea id="message" placeholder="Ваші побажання..."></textarea>
            </div>

            <div class="form-group" id="photoGroup">
                <label>Фото співробітника:</label>
                <input type="file" id="photo" accept="image/*">
            </div>
        </div>

        <div id="multiInputs" style="display:none;">

            <div class="form-group">
                <label>Головний заголовок:</label>
                <input
                        type="text"
                        id="probationTitle"
                        placeholder="ВІТАЄМО!"
                >
            </div>

            <div class="form-group">
                <label>Підзаголовок:</label>
                <textarea
                        id="probationSubtitle"
                        rows="2"
                        placeholder="з успішним проходженням випробувального терміну"
                ></textarea>
            </div>

            <div class="form-group">
                <label>Текст перед досягненнями:</label>
                <textarea
                        id="probationSubintro"
                        rows="2"
                        placeholder="За цей час Ви чудово продемонстрували свої сильні сторони..."
                ></textarea>
            </div>

            <div class="form-group">
                <label>Верхній текст (вступ):</label>
                <textarea
                        id="globalMessage"
                        rows="2"
                        placeholder="Дуже раді, що ви стали частиною нашої команди..."
                ></textarea>
            </div>

            <div class="form-group">
                <label>Нижній текст (побажання):</label>
                <textarea
                        id="footerMessage"
                        rows="2"
                        placeholder="Віримо у подальші спільні успіхи..."
                ></textarea>
            </div>

            <div id="employeesForms"
                 class="employees-forms-container">
            </div>

            <button id="addEmployeeBtn"
                    class="btn-add">
                + Додати ще одного працівника
            </button>

        </div>

        <div class="actions">
            <button class="btn-download" id="downloadBtn">ЗАВАНТАЖИТИ PNG</button>
        </div>
    </div>

    <div class="preview-panel">
        <div id="card" class="card welcome-mode">
            <div class="decor decor-1"></div>
            <div class="decor decor-2"></div>
            <div class="decor decor-3"></div>

            <div class="card-content">

                <!-- BIRTHDAY CARD -->
                <div id="singlePreview">

                    <div class="left-column">

                        <h2 id="title">
                            ВІТАЄМО<br>
                            З ДНЕМ НАРОДЖЕННЯ!
                        </h2>

                        <div class="photo-wrapper">
                            <div class="photo-circle">
                                <img id="previewPhoto" src="">
                            </div>
                        </div>

                        <div class="birthday-person-card">
                            <h3 id="previewName">Ім’я Прізвище</h3>
                            <p id="previewPosition">Посада</p>
                        </div>

                        <div class="divider"></div>

                        <p id="previewMessage" style="white-space: pre-wrap;">
                            Текст привітання буде тут...
                        </p>

                        <div class="footer-signature">
                            Команда UMO
                        </div>

                    </div>

                </div>

                <!-- PROBATION CARD -->
                <div id="multiPreview"
                     style="display:none; text-align:center;">

                    <div class="logo-container">
                        <img src="umo-logo-trans.png"
                             alt="UMO"
                             class="umo-logo">
                    </div>

                    <h2 class="probation-title"
                        id="previewProbationTitle">
                        ВІТАЄМО!
                    </h2>

                    <h3 class="probation-subtitle"
                        id="previewProbationSubtitle">
                        з успішним проходженням випробувального терміну
                    </h3>

                    <p class="probation-intro"
                       id="previewGlobalMessage">
                    </p>

                    <p class="probation-subintro"
                       id="previewProbationSubintro">
                        За цей час Ви чудово продемонстрували свої сильні сторони,
                        які б ми хотіли відзначити:
                    </p>

                    <div id="previewGrid"
                         class="preview-grid horizontal-grid">
                    </div>

                    <p class="probation-footer"
                       id="previewFooterMessage">
                    </p>

                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="script.js"></script>

</body>
</html>
